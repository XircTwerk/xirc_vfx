plugins { id 'base' }
allprojects {
    group = 'com.xirctwerk.vfx'
    version = '0.3.0'
    repositories { mavenCentral() }
}
subprojects {
    apply plugin: 'java-library'
    java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
    tasks.withType(Test).configureEach { useJUnitPlatform() }
}
tasks.named('build') { dependsOn ':core:build', ':fabric:build', ':neoforge:build' }
tasks.named('check') { dependsOn ':core:check', ':fabric:check', ':neoforge:check' }

tasks.register('stageRelease', Copy) {
    dependsOn ':core:build', ':fabric:build', ':neoforge:build'
    into layout.buildDirectory.dir("releases/${version}")
    from(project(':core').tasks.named('jar'))
    from(project(':core').tasks.named('sourcesJar'))
    from(project(':fabric').tasks.named('remapJar'))
    from(project(':fabric').tasks.named('remapSourcesJar'))
    from(project(':neoforge').tasks.named('jar'))
    from(project(':neoforge').tasks.named('sourcesJar'))
}

subprojects {
    tasks.named('jar') { from(rootProject.file('LICENSE')); from(rootProject.file('THIRD_PARTY_NOTICES.md')) }
    tasks.named('sourcesJar') { from(rootProject.file('LICENSE')); from(rootProject.file('THIRD_PARTY_NOTICES.md')) }
}

// Standard Maven layout, POM dependencies, source jars and Gradle variant metadata.
subprojects {
    apply plugin: 'maven-publish'
    publishing {
        publications {
            vfx(MavenPublication) {
                from components.java
                artifactId = "xirc_vfx-${project.name}"
                pom {
                    name = "Xirc's VFX (${project.name})"
                    description = "Minecraft 1.21.1 visual effects library by XircTwerk"
                    url = 'https://github.com/XircTwerk/xirc_vfx'
                    licenses { license { name = 'MIT'; url = 'https://opensource.org/license/mit' } }
                    developers { developer { id = 'XircTwerk'; name = 'XircTwerk' } }
                    scm { url = 'https://github.com/XircTwerk/xirc_vfx'; connection = 'scm:git:https://github.com/XircTwerk/xirc_vfx.git' }
                }
            }
        }
        repositories { maven { name = 'Staging'; url = rootProject.layout.buildDirectory.dir('maven') } }
    }
}
tasks.register('stageMaven') { dependsOn subprojects.collect { it.tasks.named('publishVfxPublicationToStagingRepository') } }
