name: Build and validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Build both loaders and run semantic/schema tests
        run: bash gradlew --no-daemon :core:test build stageMaven
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: xirc-vfx-1.21.1
          path: |
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar
            core/build/libs/*.jar
            build/maven/**
            core/build/reports/tests/test/
          if-no-files-found: error
